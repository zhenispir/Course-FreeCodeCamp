<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="blog-post-card">
      <img
        class="post-img"
        src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
        alt="Mountain landscape cover photo"
      />

      <div class="post-content">
        <h2 class="post-title">Exploring the Mountains</h2>

        <p class="post-excerpt">
          Discover the beauty of mountain landscapes and learn why hiking is one
          of the most refreshing outdoor activities you can experience.
        </p>

        <a href="#" class="read-more">Read More</a>
      </div>
    </div>
  </body>
</html>

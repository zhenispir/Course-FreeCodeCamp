<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Daily Focus Planner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>✨ Daily Focus Planner</h1>

      <ul class="todo-list">
        <li>
          <input type="checkbox" id="task1" />
          <label for="task1">Study HTML Basics</label>

          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://developer.mozilla.org/en-US/docs/Web/HTML"
                target="_blank"
              >
                HTML Documentation
              </a>
            </li>
          </ul>
        </li>

        <li>
          <input type="checkbox" id="task2" />
          <label for="task2">Practice CSS Styling</label>

          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://developer.mozilla.org/en-US/docs/Web/CSS"
                target="_blank"
              >
                CSS Reference Guide
              </a>
            </li>
          </ul>
        </li>

        <li>
          <input type="checkbox" id="task3" />
          <label for="task3">Build Mini Project</label>

          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://codepen.io/"
                target="_blank"
              >
                Try CodePen
              </a>
            </li>
          </ul>
        </li>

        <li>
          <input type="checkbox" id="task4" />
          <label for="task4">Review JavaScript</label>

          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://developer.mozilla.org/en-US/docs/Web/JavaScript"
                target="_blank"
              >
                JavaScript Guide
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </body>
</html>
